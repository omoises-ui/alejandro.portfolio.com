name: Polish music page
on:
  push:
    paths:
      - '.github/workflows/polish-music.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update music page copy and language switch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('music.html')
          s=p.read_text()
          if 'data-site-lang="music"' in s:
              raise SystemExit(0)
          reps={
          '<nav><a class="logo" href="index.html">ALEJANDRO</a><div class="nav-links"><a href="#azul-animal">Azul Animal</a><a href="#todos-los-monstruos">Todos los Monstruos</a><a href="#harakiri-robot">#HarakiriRobot</a></div></nav>':'<nav data-site-lang="music"><a class="logo" href="index.html">ALEJANDRO</a><div class="nav-links"><a href="#azul-animal">Azul Animal</a><a href="#todos-los-monstruos">Todos los Monstruos</a><a href="#harakiri-robot">#HarakiriRobot</a><span class="lang-switch"><button type="button" data-lang="en" class="active">EN</button><span>/</span><button type="button" data-lang="de">DE</button></span></div></nav>',
          '<div class="eyebrow">Selected Work · 2004—Today</div>':'<div class="eyebrow" data-en="Selected Work · 2004—Today" data-de="Ausgewählte Arbeiten · 2004—Heute">Selected Work · 2004—Today</div>',
          '<h1>Music Project<br>Development</h1>':'<h1 data-i18n-html data-en="Music Project<br>Development" data-de="Musikprojekt-<br>entwicklung">Music Project<br>Development</h1>',
          '<p class="intro-copy">Three independent projects. Three stages of artist development. One consistent approach: turning music into identity, narrative, live experience and audience.</p>':'<p class="intro-copy" data-en="Three independent projects. Three stages of artist development. One consistent approach: turning music into identity, narrative, live experience and audience." data-de="Drei unabhängige Projekte. Drei Phasen der Künstlerentwicklung. Ein konsequenter Ansatz: Musik in Identität, Narrativ, Live-Erlebnis und Publikum zu übersetzen.">Three independent projects. Three stages of artist development. One consistent approach: turning music into identity, narrative, live experience and audience.</p>',
          '<p class="intro-note">Across Caracas, Mexico City, Buenos Aires and Berlin, I have worked from inside the artist journey—writing and developing music while building the visual language, teams, release strategies and communities that allow a project to grow.</p>':'<p class="intro-note" data-en="Across Caracas, Mexico City, Buenos Aires and Berlin, I have worked from inside the artist journey—writing and developing music while building the visual language, teams, release strategies and communities that allow a project to grow." data-de="In Caracas, Mexiko-Stadt, Buenos Aires und Berlin habe ich Künstlerentwicklung von innen erlebt: Musik schreiben und entwickeln, visuelle Sprache aufbauen, Teams führen, Release-Strategien gestalten und Communities entwickeln.">Across Caracas, Mexico City, Buenos Aires and Berlin, I have worked from inside the artist journey—writing and developing music while building the visual language, teams, release strategies and communities that allow a project to grow.</p>',
          '<div class="statement-side"><div class="eyebrow">Artist experience · Business vision</div><h2 id="music-statement-title">From the stage<br>to Music Business.</h2></div>':'<div class="statement-side"><div class="eyebrow" data-en="Artist experience · A&R vision" data-de="Künstlererfahrung · A&R-Vision">Artist experience · A&R vision</div><h2 id="music-statement-title" data-i18n-html data-en="From the stage<br>to A&amp;R." data-de="Von der Bühne<br>ins A&amp;R.">From the stage<br>to A&amp;R.</h2></div>',
          '<p class="statement-lead">My journey in music began in Caracas, Venezuela, as the vocalist, songwriter and leader of <strong>Azul Animal</strong>.</p>':'<p class="statement-lead" data-en="My journey in music began in Caracas, Venezuela, as the vocalist, songwriter and leader of <strong>Azul Animal</strong>." data-de="Mein Weg in der Musik begann in Caracas, Venezuela, als Sänger, Songwriter und Leiter von <strong>Azul Animal</strong>.">My journey in music began in Caracas, Venezuela, as the vocalist, songwriter and leader of <strong>Azul Animal</strong>.</p>',
          '<p>Today, that journey leads me into a new professional chapter: <strong>Music Business</strong>. My aim is to combine my experience as an artist and project developer with the tools shaping today’s industry—<strong>A&amp;R, artist management, music marketing, copyright and global distribution</strong>.</p>':'<p data-en="Today, that journey leads directly into A&amp;R: combining artist-side experience with scouting, repertoire development, positioning, audience insight and the business structures that allow talent to grow." data-de="Heute führt dieser Weg direkt ins A&amp;R: Künstlererfahrung verbunden mit Scouting, Repertoireentwicklung, Positionierung, Zielgruppenverständnis und den Business-Strukturen, die Talent wachsen lassen.">Today, that journey leads directly into A&amp;R: combining artist-side experience with scouting, repertoire development, positioning, audience insight and the business structures that allow talent to grow.</p>',
          '<p>I want to become a bridge between creative vision and business strategy, helping emerging artists build solid careers, monetise their work and create music that can travel and endure sustainably.</p>':'<p data-en="My value in A&amp;R is the ability to understand both sides of the table: the artist who needs trust, identity and direction, and the business that needs clarity, momentum and long-term value." data-de="Mein Mehrwert im A&amp;R liegt darin, beide Seiten des Tisches zu verstehen: den Künstler, der Vertrauen, Identität und Richtung braucht, und das Business, das Klarheit, Momentum und langfristigen Wert braucht.">My value in A&amp;R is the ability to understand both sides of the table: the artist who needs trust, identity and direction, and the business that needs clarity, momentum and long-term value.</p>',
          '<p class="statement-closing">This portfolio documents the path that brought me here—and the beginning of a new stage where artistic experience becomes strategic vision.</p>':'<p class="statement-closing" data-en="This portfolio is evidence of artist development already done in practice — now focused toward professional A&amp;R." data-de="Dieses Portfolio zeigt Künstlerentwicklung, die bereits praktisch stattgefunden hat – jetzt klar auf professionelles A&amp;R ausgerichtet.">This portfolio is evidence of artist development already done in practice — now focused toward professional A&amp;R.</p>',
          '<iframe src="https://www.youtube.com/embed/NHqJCW6VMoM" title="Azul Animal — Material Multimedia incluido en el EP Sentidos"':'<iframe src="https://www.youtube.com/embed/NHqJCW6VMoM" title="Azul Animal — Multimedia material included with the Sentidos EP"',
          '<figcaption><span>Material Multimedia incluido en el EP “Sentidos”.</span><span>Azul Animal</span></figcaption>':'<figcaption><span data-en="Multimedia material included with the “Sentidos” EP." data-de="Multimedia-Material der EP „Sentidos“.">Multimedia material included with the “Sentidos” EP.</span><span>Azul Animal</span></figcaption>',
          '<figcaption><span>Sentidos</span><span>Primer sencillo de Azul Animal · 2009</span></figcaption>':'<figcaption><span>Sentidos</span><span data-en="Azul Animal’s first single · 2009" data-de="Erste Single von Azul Animal · 2009">Azul Animal’s first single · 2009</span></figcaption>',
          '<p>Este compilado nos abrió las puertas al mercado underground de Ciudad de México y sus alrededores, logrando así más de 13 mil seguidores en MySpace.</p>':'<p data-en="This compilation opened the door to the underground market in Mexico City and its surrounding scene, helping us grow to more than 13,000 MySpace followers." data-de="Diese Compilation öffnete uns den Zugang zur Underground-Szene in Mexiko-Stadt und Umgebung und half uns, mehr als 13.000 MySpace-Follower aufzubauen.">This compilation opened the door to the underground market in Mexico City and its surrounding scene, helping us grow to more than 13,000 MySpace followers.</p>',
          'aria-label="Escuchar Azul Animal en Spotify"':'aria-label="Listen to Azul Animal on Spotify"',
          '<figcaption><span>Alter-Nation</span><span>Carpe Diem Records México · Incluye “Sentidos” y “Agorafobia”</span></figcaption>':'<figcaption><span>Alter-Nation</span><span data-en="Carpe Diem Records México · Includes “Sentidos” and “Agorafobia”" data-de="Carpe Diem Records México · Enthält „Sentidos“ und „Agorafobia“">Carpe Diem Records México · Includes “Sentidos” and “Agorafobia”</span></figcaption>',
          '<figcaption><span>EP Flashback</span><span>Primer sencillo de la banda · 2012</span></figcaption>':'<figcaption><span>EP Flashback</span><span data-en="First single by the band · 2012" data-de="Erste Single der Band · 2012">First single by the band · 2012</span></figcaption>',
          'alt="Kit de prensa Invencible de Todos los Monstruos"':'alt="Invencible press kit by Todos los Monstruos"',
          '<figcaption><span>Kit de prensa “Invencible”</span><span>Tercer sencillo de la banda</span></figcaption>':'<figcaption><span data-en="“Invencible” press kit" data-de="Pressekit „Invencible“">“Invencible” press kit</span><span data-en="Third single by the band" data-de="Dritte Single der Band">Third single by the band</span></figcaption>',
          '<figcaption><span>Video clip oficial</span><span>Sencillo “Invencible”</span></figcaption>':'<figcaption><span data-en="Official music video" data-de="Offizielles Musikvideo">Official music video</span><span data-en="Single “Invencible”" data-de="Single „Invencible“">Single “Invencible”</span></figcaption>',
          'aria-label="Muestra de flyers de Todos los Monstruos"':'aria-label="Selected Todos los Monstruos flyers"',
          'aria-label="Ampliar flyer del lanzamiento de Flashback"':'aria-label="Enlarge Flashback release flyer"',
          'alt="Flyer amarillo y azul del lanzamiento de Flashback"':'alt="Yellow and blue Flashback release flyer"',
          'aria-label="Ampliar flyer de Y Acción"':'aria-label="Enlarge Y Acción flyer"',
          'alt="Flyer de Y Acción y el videocase de Invencible"':'alt="Y Acción and Invencible videocase flyer"',
          'aria-label="Ampliar flyer de Culto Oculto"':'aria-label="Enlarge Culto Oculto flyer"',
          'alt="Flyer de Todos los Monstruos con Culto Oculto"':'alt="Todos los Monstruos with Culto Oculto flyer"',
          'aria-label="Ampliar flyer de la gira Ella Sonríe"':'aria-label="Enlarge Ella Sonríe tour flyer"',
          'alt="Flyer de la gira promocional Ella Sonríe"':'alt="Ella Sonríe promotional tour flyer"',
          'aria-label="Ampliar flyer del Circuito Nuevas Bandas"':'aria-label="Enlarge Circuito Nuevas Bandas flyer"',
          'alt="Flyer de Todos los Monstruos en el Circuito Nuevas Bandas"':'alt="Todos los Monstruos at Circuito Nuevas Bandas flyer"',
          '<figcaption><span>Muestra de material gráfico</span><span>Colaboración con Jean Piero Montilla · Clic para ampliar</span></figcaption>':'<figcaption><span data-en="Selected graphic material" data-de="Ausgewähltes Grafikmaterial">Selected graphic material</span><span data-en="Collaboration with Jean Piero Montilla · Click to enlarge" data-de="Zusammenarbeit mit Jean Piero Montilla · Zum Vergrößern klicken">Collaboration with Jean Piero Montilla · Click to enlarge</span></figcaption>',
          '<section class="skills"><h2>What these projects taught me</h2>':'<section class="skills"><h2 data-en="What these projects taught me about A&amp;R" data-de="Was mich diese Projekte über A&amp;R gelehrt haben">What these projects taught me about A&amp;R</h2>',
          '<p class="skills-copy">First-hand experience across every stage of artist development: finding a distinctive sound, defining positioning, building visual identity and storytelling, developing live performance, assembling teams, generating media attention and connecting projects with audiences.</p>':'<p class="skills-copy" data-en="First-hand experience across every stage of artist development: finding a distinctive sound, defining positioning, building visual identity and storytelling, developing live performance, assembling teams, generating media attention and connecting projects with audiences." data-de="Praktische Erfahrung in jeder Phase der Künstlerentwicklung: eigenständigen Sound finden, Positionierung definieren, visuelle Identität und Storytelling aufbauen, Live-Performance entwickeln, Teams zusammenstellen, Medienaufmerksamkeit erzeugen und Projekte mit Publikum verbinden.">First-hand experience across every stage of artist development: finding a distinctive sound, defining positioning, building visual identity and storytelling, developing live performance, assembling teams, generating media attention and connecting projects with audiences.</p>',
          '<section class="closing"><p>I have spent years doing artist development from the inside. Now I bring that experience to the A&amp;R side of the industry.</p>':'<section class="closing"><p data-en="I have spent years doing artist development from the inside. Now I bring that experience to the A&amp;R side of the industry." data-de="Ich habe jahrelang Künstlerentwicklung von innen betrieben. Jetzt bringe ich diese Erfahrung auf die A&amp;R-Seite der Musikindustrie.">I have spent years doing artist development from the inside. Now I bring that experience to the A&amp;R side of the industry.</p>'
          }
          for old,new in reps.items():
              if old in s:
                  s=s.replace(old,new)
          s=s.replace('.nav-links a:hover,.back:hover{opacity:.5}', '.nav-links a:hover,.back:hover{opacity:.5}.lang-switch{display:inline-flex;gap:7px;align-items:center;margin-left:auto}.lang-switch button{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:4px}.lang-switch button.active{font-weight:700;text-decoration:underline;text-underline-offset:3px}')
          marker='</body>'
          script='''<script>\n(()=>{const b=[...document.querySelectorAll('[data-lang]')],n=[...document.querySelectorAll('[data-en][data-de]')];const a=l=>{document.documentElement.lang=l;localStorage.setItem('portfolioLang',l);n.forEach(e=>{const v=e.dataset[l];if(v==null)return;if(e.hasAttribute('data-i18n-html'))e.innerHTML=v;else e.textContent=v});b.forEach(x=>x.classList.toggle('active',x.dataset.lang===l))};b.forEach(x=>x.addEventListener('click',()=>a(x.dataset.lang)));a(localStorage.getItem('portfolioLang')==='de'?'de':'en')})();\n</script>\n'''
          s=s.replace(marker,script+marker)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish music page copy and add EN/DE switch"
          git push
