name: Enrich journalism profile
on:
  push:
    paths:
      - '.github/workflows/enrich-journalism-profile.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enrich journalism page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('journalism.html')
          s=p.read_text()

          s=s.replace(
          'Radio production experience connected to programs hosted by César Miguel Rondón. Working around a high-level daily broadcast sharpened my sense of editorial preparation, topic selection, timing and the production systems that support strong on-air talent.',
          'I worked in production around programs hosted by César Miguel Rondón, one of the most influential voices in Venezuelan and Latin American radio and journalism. A journalist, broadcaster and author with a career spanning decades, he is also widely known for <em>El Libro de la Salsa</em>, a landmark work on Caribbean popular music. Working around this level of broadcast sharpened my sense of editorial preparation, topic selection, timing and the production systems that support strong on-air talent.'
          )
          s=s.replace(
          'Radio-Produktion im Umfeld von Sendungen mit César Miguel Rondón. Die Arbeit an einem professionellen täglichen Broadcast schärfte mein Verständnis für redaktionelle Vorbereitung, Themenauswahl, Timing und die Produktionssysteme hinter starken On-Air-Persönlichkeiten.',
          'Ich arbeitete in der Produktion von Sendungen mit César Miguel Rondón, einer der einflussreichsten Stimmen des venezolanischen und lateinamerikanischen Radiojournalismus. Der Journalist, Moderator und Autor blickt auf eine jahrzehntelange Karriere zurück und ist auch für <em>El Libro de la Salsa</em> bekannt, ein bedeutendes Werk über karibische Populärmusik. Die Arbeit in diesem Umfeld schärfte mein Verständnis für redaktionelle Vorbereitung, Themenauswahl, Timing und die Produktionssysteme hinter starken On-Air-Persönlichkeiten.'
          )
          s=s.replace(
          "Television production experience around Oscar Yanes, one of Venezuela's most recognised journalistic voices. The work reinforced how personality, storytelling and editorial framing can turn information into memorable television.",
          "I worked in television production around Oscar Yanes, a pioneer of Venezuelan audiovisual journalism and a three-time winner of Venezuela's National Journalism Prize. His career ranged from war correspondence in Vietnam to some of the country's most recognisable interview and current-affairs programs. Working around his television projects reinforced how personality, storytelling and editorial framing can turn information into memorable media."
          )
          s=s.replace(
          'TV-Produktion im Umfeld von Oscar Yanes, einer der bekanntesten journalistischen Stimmen Venezuelas. Die Arbeit zeigte mir, wie Persönlichkeit, Storytelling und redaktionelles Framing Informationen in erinnerungswürdiges Fernsehen verwandeln können.',
          'Ich arbeitete in der TV-Produktion im Umfeld von Oscar Yanes, einem Pionier des venezolanischen Fernsehjournalismus und dreifachen Gewinner des Nationalen Journalistenpreises. Seine Karriere reichte von der Kriegsberichterstattung in Vietnam bis zu einigen der bekanntesten Interview- und Informationssendungen des Landes. Die Arbeit an seinen TV-Projekten zeigte mir, wie Persönlichkeit, Storytelling und redaktionelles Framing Informationen in erinnerungswürdige Medieninhalte verwandeln können.'
          )

          marker='<section class="section broadcast-section" id="broadcast">'
          if 'id="high-profile-interviews"' not in s:
            block='''<section class="section" id="high-profile-interviews">\n  <div class="section-head"><div><div class="section-kicker" data-en="High-profile interviews · Live television" data-de="Hochkarätige Interviews · Live-Fernsehen">High-profile interviews · Live television</div><h2 data-en="From research desk to live control." data-de="Von der Recherche bis zur Live-Regie.">From research desk to live control.</h2></div><p data-en="I also worked as a producer on high-profile political and presidential interviews. My responsibilities ranged from researching background information and helping structure the interview material to coordinating and controlling technical aspects during live broadcasts." data-de="Ich arbeitete außerdem als Produzent bei hochkarätigen politischen und präsidialen Interviews. Meine Aufgaben reichten von Hintergrundrecherche und der inhaltlichen Vorbereitung der Interviews bis zur Koordination und Kontrolle technischer Abläufe während Live-Sendungen.">I also worked as a producer on high-profile political and presidential interviews. My responsibilities ranged from researching background information and helping structure the interview material to coordinating and controlling technical aspects during live broadcasts.</p></div>\n  <div class="tv-grid">\n    <article class="tv-piece"><div class="video-frame"><iframe src="https://www.youtube.com/embed/TGtro-s-eq8" title="Eduardo Rodríguez and Karla Salcedo interview Hugo Chávez at Venevisión, 2009" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="piece-caption"><div class="piece-number">03</div><div><h3 data-en="Presidential Interview Production" data-de="Produktion eines Präsidenteninterviews">Presidential Interview Production</h3><div class="piece-meta" data-en="Eduardo Rodríguez & Karla Salcedo · Hugo Chávez · Venevisión · 2009" data-de="Eduardo Rodríguez & Karla Salcedo · Hugo Chávez · Venevisión · 2009">Eduardo Rodríguez & Karla Salcedo · Hugo Chávez · Venevisión · 2009</div></div></div></article>\n    <article class="tv-piece"><div class="piece-caption" style="margin-top:0"><div class="piece-number">Role</div><div><h3 data-en="Research + Editorial + Live Production" data-de="Recherche + Redaktion + Live-Produktion">Research + Editorial + Live Production</h3><div class="piece-meta" style="text-transform:none;letter-spacing:0;font-size:15px;line-height:1.65;opacity:.78" data-en="The job began before the cameras were on: researching the interviewee and context, gathering information, helping build the editorial structure and preparing the material the interview team needed. During transmission, the responsibility shifted to live coordination and technical control — making sure the editorial intention survived contact with real-time television." data-de="Die Arbeit begann lange vor dem Einschalten der Kameras: Recherche zur interviewten Person und zum Kontext, Informationsbeschaffung, Unterstützung beim redaktionellen Aufbau und Vorbereitung des Materials für das Interviewteam. Während der Übertragung verlagerte sich die Verantwortung auf Live-Koordination und technische Kontrolle – damit die redaktionelle Absicht auch unter Echtzeitbedingungen erhalten blieb.">The job began before the cameras were on: researching the interviewee and context, gathering information, helping build the editorial structure and preparing the material the interview team needed. During transmission, the responsibility shifted to live coordination and technical control — making sure the editorial intention survived contact with real-time television.</div></div></div></article>\n  </div>\n</section>\n'''
            s=s.replace(marker,block+marker)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journalism.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enrich journalism profile with media figures and interview production"
          git push
