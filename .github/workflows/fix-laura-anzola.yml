name: Fix Laura Anzola name
on:
  push:
    paths:
      - '.github/workflows/fix-laura-anzola.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct producer name
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('journalism.html')
          s=p.read_text()
          s=s.replace('Laura Rodríguez','Laura Anzola')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journalism.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct Laura Anzola name"
          git push
