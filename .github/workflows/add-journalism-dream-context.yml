name: Add journalism dream context
on:
  push:
    paths:
      - '.github/workflows/add-journalism-dream-context.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update journalism copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('journalism.html')
          s=p.read_text()
          old_en='At just 21, I was already working both in front of the camera and behind it, helping bring television reports and special programs on music and extreme sports to life. It was a formative experience that gave me a solid understanding of how media works — from research and production to editorial framing and on-camera communication. Today, that knowledge directly strengthens my A&amp;R perspective: I understand not only how to identify and develop an artist, but also how to shape a story and proposition that media outlets can recognise, program and bring to wider audiences.'
          new_en='At just 21, as a newly graduated journalist, I was already working both in front of the camera and behind it on some of the country’s most visible and relevant television productions, across major broadcasters such as Venevisión and Televen. For me, it was a dream fulfilled: moving directly from journalism school into national television and helping bring reports and special programs on music, culture and extreme sports to life. That experience gave me a solid understanding of how media works — from research and production to editorial framing, live coordination and on-camera communication. Today, that knowledge directly strengthens my A&amp;R perspective: I understand not only how to identify and develop an artist, but also how to shape a story and proposition that media outlets can recognise, program and bring to wider audiences.'
          old_de='Mit nur 21 Jahren arbeitete ich bereits sowohl vor der Kamera als auch dahinter und half dabei, TV-Reportagen sowie Sondersendungen über Musik und Extremsport zum Leben zu erwecken. Diese prägende Erfahrung gab mir ein solides Verständnis dafür, wie Medien funktionieren – von Recherche und Produktion bis hin zu redaktionellem Framing und Kommunikation vor der Kamera. Heute stärkt dieses Wissen direkt meine A&amp;R-Perspektive: Ich verstehe nicht nur, wie man Künstler erkennt und entwickelt, sondern auch, wie man eine Geschichte und Positionierung so formt, dass Medien sie erkennen, programmieren und einem größeren Publikum zugänglich machen können.'
          new_de='Mit nur 21 Jahren und frisch abgeschlossenem Journalismusstudium arbeitete ich bereits vor und hinter der Kamera an einigen der sichtbarsten und relevantesten Fernsehproduktionen des Landes – bei großen Sendern wie Venevisión und Televen. Für mich ging damit ein Traum in Erfüllung: direkt von der Journalistenausbildung ins nationale Fernsehen zu wechseln und Reportagen sowie Sondersendungen über Musik, Kultur und Extremsport mitzugestalten. Diese Erfahrung gab mir ein solides Verständnis dafür, wie Medien funktionieren – von Recherche und Produktion über redaktionelles Framing und Live-Koordination bis zur Kommunikation vor der Kamera. Heute stärkt dieses Wissen direkt meine A&amp;R-Perspektive: Ich verstehe nicht nur, wie man Künstler erkennt und entwickelt, sondern auch, wie man eine Geschichte und Positionierung so formt, dass Medien sie erkennen, programmieren und einem größeren Publikum zugänglich machen können.'
          if old_en not in s or old_de not in s:
              raise SystemExit('Target journalism paragraph not found')
          s=s.replace(old_en,new_en)
          s=s.replace(old_de,new_de)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journalism.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add broadcaster context and journalism milestone"
          git push
