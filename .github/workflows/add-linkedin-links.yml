name: Add LinkedIn links
on:
  push:
    paths:
      - '.github/workflows/add-linkedin-links.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified LinkedIn link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('journalism.html')
          s=p.read_text()
          css='.profile-link{display:inline-block;margin-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#f5f3ee;text-underline-offset:4px}.profile-link:hover{opacity:.6}'
          if css not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          url='https://www.linkedin.com/in/ces%C3%A1r-miguel-rond%C3%B3n-724004204'
          # Add after CMR meta only once; exact surrounding text may evolve, so locate the CMR card and its first broadcast-meta.
          marker='<h3>César Miguel Rondón</h3>'
          if marker not in s:
              marker='<h3>Cesar Miguel Rondon</h3>'
          pos=s.find(marker)
          if pos!=-1 and url not in s:
              meta=s.find('</div>', s.find('class="broadcast-meta"',pos))
              if meta!=-1:
                  meta+=6
                  link='\n<a class="profile-link" href="'+url+'" target="_blank" rel="noopener noreferrer" data-en="LinkedIn profile ↗" data-de="LinkedIn-Profil ↗">LinkedIn profile ↗</a>'
                  s=s[:meta]+link+s[meta:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journalism.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add César Miguel Rondón LinkedIn profile"
          git push
